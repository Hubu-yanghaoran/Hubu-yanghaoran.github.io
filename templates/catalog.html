<div class="eyebrow">$eyebrow</div>
<h1>$heading</h1>
<p>$intro</p>
$featured
<div class="toolbar">
  <div class="control"><label for="search">$search_label</label><input id="search" type="search" placeholder="输入标题、摘要或标签" autocomplete="off"></div>
  <div class="control"><label for="category">$category_label</label><select id="category"><option value="all">全部分类</option></select></div>
  $sort_control
</div>
<div class="section-title"><span id="result-count" role="status" aria-live="polite">$count</span><button id="clear" class="clear" type="button">清除筛选</button></div>
<noscript><p class="callout">当前显示完整目录。启用 JavaScript 后可搜索与筛选。</p></noscript>
<div id="results">$results</div>
